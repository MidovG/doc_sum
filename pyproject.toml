[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsum"
version = "1.0.0"
description = "Общее саммари по всем документам в папке (локальной или Google Drive) с помощью LLM"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "striprtf>=0.0.26",
    "gdown>=5.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["docsum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
